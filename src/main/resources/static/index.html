<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h1>Login</h1>
            <form id="loginForm">
                <div class="input-group">
                    <label>Usuário</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu usuário"
                        required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required>
                </div>
                <button type="submit">
                    Entrar
                </button>
            </form>
            <div id="mensagem"></div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
